<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13">
  <title>The path a boto3 call takes in the browser: Python in Pyodide, one transport function, four destinations</title>
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5c5f66"/></marker>
    <marker id="mt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="mw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="500" fill="#faf9f5"/>

  <!-- browser frame -->
  <rect x="16" y="16" width="640" height="468" rx="14" fill="#ffffff" stroke="#d5d0c2"/>
  <text x="32" y="40" font-size="11" fill="#5c5f66" letter-spacing="2" font-weight="700">THE BROWSER · ONE PAGE · MEASURED 21 OCTOBER 2026</text>

  <!-- python in pyodide -->
  <rect x="32" y="56" width="250" height="150" rx="12" fill="rgba(29,78,216,.06)" stroke="#1d4ed8" stroke-width="2"/>
  <text x="48" y="80" font-weight="700" fill="#101114">Python in Pyodide 0.28.3</text>
  <text x="48" y="100" font-size="12" fill="#34363c">Python 3.13.2 · boto3 1.43.116</text>
  <text x="48" y="118" font-size="12" fill="#34363c">loaded in 2.7 s · installed in 4.4 s</text>
  <text x="48" y="136" font-size="12" fill="#34363c">24.2 MB, 16 MB of it botocore's models</text>
  <text x="48" y="160" font-size="12" fill="#101114" font-weight="700">botocore signs every request</text>
  <text x="48" y="178" font-size="12" fill="#34363c">SigV4, from the session in the vault,</text>
  <text x="48" y="194" font-size="12" fill="#34363c">11 of 11 calls carried Authorization</text>

  <line x1="282" y1="130" x2="330" y2="130" stroke="#5c5f66" stroke-width="2" marker-end="url(#m)"/>

  <!-- the hook -->
  <rect x="334" y="88" width="300" height="84" rx="12" fill="rgba(15,118,110,.08)" stroke="#0f766e" stroke-width="2"/>
  <text x="350" y="112" font-weight="700" fill="#101114">the transport: one function</text>
  <text x="350" y="132" font-size="12" fill="#34363c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">URLLib3Session.send = _send</text>
  <text x="350" y="152" font-size="12" fill="#34363c">method, url, signed headers, body in;</text>
  <text x="350" y="166" font-size="12" fill="#34363c">status, headers, body out</text>

  <!-- four arrows -->
  <line x1="420" y1="172" x2="420" y2="258" stroke="#0f766e" stroke-width="2" marker-end="url(#mt)"/>
  <text x="430" y="220" font-size="11" fill="#0f766e" font-weight="700">1 · see and simulate</text>
  <line x1="560" y1="172" x2="560" y2="258" stroke="#5c5f66" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#m)"/>
  <text x="570" y="220" font-size="11" fill="#5c5f66" font-weight="700">2 · record / 3 · replay</text>
  <line x1="634" y1="130" x2="700" y2="130" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#mw)"/>
  <text x="640" y="118" font-size="11" fill="#b45309" font-weight="700">4 · continue to AWS</text>

  <!-- twin -->
  <rect x="334" y="262" width="170" height="130" rx="12" fill="rgba(15,118,110,.06)" stroke="#0f766e" stroke-width="2"/>
  <text x="350" y="286" font-weight="700" fill="#101114">the twin</text>
  <text x="350" y="306" font-size="12" fill="#34363c">the vault re-implementation</text>
  <text x="350" y="324" font-size="12" fill="#34363c">answered 11 calls in 1.7 s:</text>
  <text x="350" y="342" font-size="12" fill="#34363c">STS (query), S3 (rest-xml),</text>
  <text x="350" y="360" font-size="12" fill="#34363c">Lambda (rest-json)</text>
  <rect x="350" y="370" width="48" height="18" rx="9" fill="rgba(15,118,110,.12)" stroke="#0f766e"/>
  <text x="374" y="383" font-size="10" text-anchor="middle" fill="#0f766e" font-weight="700">RAN</text>

  <!-- record/replay -->
  <rect x="520" y="262" width="120" height="130" rx="12" fill="#f2f0e9" stroke="#8a8d94" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="536" y="286" font-weight="700" fill="#101114">a recording</text>
  <text x="536" y="306" font-size="12" fill="#34363c">the bridge's log,</text>
  <text x="536" y="324" font-size="12" fill="#34363c">played back as</text>
  <text x="536" y="342" font-size="12" fill="#34363c">a backend</text>
  <rect x="536" y="370" width="72" height="18" rx="9" fill="#e5e1d5" stroke="#8a8d94"/>
  <text x="572" y="383" font-size="10" text-anchor="middle" fill="#5c5f66" font-weight="700">DESIGNED</text>

  <!-- vault -->
  <rect x="32" y="262" width="250" height="130" rx="12" fill="rgba(15,118,110,.04)" stroke="#0f766e" stroke-width="1.5"/>
  <text x="48" y="286" font-weight="700" fill="#101114">the vault (localStorage here)</text>
  <text x="48" y="306" font-size="12" fill="#34363c">the session, for its lifetime</text>
  <text x="48" y="324" font-size="12" fill="#34363c">the twin's state, as commits</text>
  <text x="48" y="342" font-size="12" fill="#34363c">what live reads will land in</text>
  <line x1="282" y1="330" x2="330" y2="330" stroke="#0f766e" stroke-width="1.5" marker-end="url(#mt)"/>

  <text x="32" y="420" font-size="11" fill="#5c5f66">The twin speaks the SDK's shape; for boto3 the bridge translates the wire into it.</text>
  <text x="32" y="436" font-size="11" fill="#5c5f66">Open question in the brief: stay SDK-shaped with a wire adapter, or move the twin to the wire.</text>
  <text x="32" y="464" font-size="11" fill="#5c5f66">Three runs: 10.0 s, 14.3 s and 57.8 s wall; the bytes were the same each time.</text>

  <!-- AWS -->
  <rect x="704" y="56" width="240" height="330" rx="12" fill="rgba(180,83,9,.05)" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="720" y="80" font-weight="700" fill="#101114">AWS, through fetch</text>
  <text x="720" y="98" font-size="12" fill="#b45309" font-weight="700">not yet run with credentials</text>
  <text x="720" y="124" font-size="11" fill="#5c5f66" letter-spacing="1.5" font-weight="700">CORS, MEASURED, NO CREDENTIALS</text>
  <g font-size="12" fill="#34363c">
    <text x="720" y="146">sts, global and regional</text>
    <text x="720" y="164">lambda</text>
    <text x="720" y="182">ec2</text>
    <text x="720" y="200">iam</text>
    <text x="720" y="218">logs</text>
    <text x="720" y="236">ce (Cost Explorer)</text>
    <text x="720" y="254">cloudformation</text>
  </g>
  <g font-size="11" fill="#0f766e" font-weight="700" text-anchor="end">
    <text x="928" y="146">answers</text>
    <text x="928" y="164">answers</text>
    <text x="928" y="182">answers</text>
    <text x="928" y="200">answers</text>
    <text x="928" y="218">answers</text>
    <text x="928" y="236">answers</text>
    <text x="928" y="254">answers</text>
  </g>
  <line x1="720" y1="266" x2="928" y2="266" stroke="#e5e1d5"/>
  <text x="720" y="286" font-size="12" fill="#34363c">s3</text>
  <text x="928" y="286" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="end">needs a bucket rule</text>
  <text x="720" y="312" font-size="11" fill="#5c5f66">Access-Control-Allow-Origin: *</text>
  <text x="720" y="328" font-size="11" fill="#5c5f66">Allow-Headers: authorization,</text>
  <text x="720" y="344" font-size="11" fill="#5c5f66">  x-amz-date, content-type</text>
  <text x="720" y="360" font-size="11" fill="#5c5f66">Max-Age: 172800 · control: blocked</text>
</svg>
