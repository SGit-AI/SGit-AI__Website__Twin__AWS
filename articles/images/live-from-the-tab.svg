<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="940" height="500" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13">
  <title>From a browser tab to a real AWS account: Python signs in the tab, STS answers directly, S3 through a relay on your own machine, and no server of ours in the path</title>
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5c5f66"/></marker>
    <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <marker id="mw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
  </defs>
  <rect width="940" height="500" fill="#faf9f5"/>

  <!-- the tab -->
  <rect x="20" y="20" width="340" height="380" rx="14" fill="#ffffff" stroke="#d5d0c2"/>
  <text x="38" y="46" font-size="11" fill="#5c5f66" letter-spacing="2" font-weight="700">THIS BROWSER TAB · aws.twin.sgit.ai</text>
  <rect x="38" y="60" width="304" height="46" rx="8" fill="rgba(29,78,216,.06)" stroke="#1d4ed8"/>
  <text x="52" y="80" font-weight="700" fill="#101114">The S3 browser · OSBot-AWS · boto3</text>
  <text x="52" y="96" font-size="11" fill="#34363c">Python 3.13 in Pyodide, every button a Python call</text>
  <rect x="38" y="118" width="304" height="46" rx="8" fill="#ffffff" stroke="#d5d0c2"/>
  <text x="52" y="138" font-weight="700" fill="#101114">The session, pasted</text>
  <text x="52" y="154" font-size="11" fill="#34363c">sessionStorage, this tab only, gone in an hour</text>
  <rect x="38" y="176" width="304" height="62" rx="8" fill="rgba(15,118,110,.07)" stroke="#0f766e" stroke-width="1.6"/>
  <text x="52" y="196" font-weight="700" fill="#101114">botocore signs every request (SigV4)</text>
  <text x="52" y="212" font-size="11" fill="#34363c">the secret key is used here and</text>
  <text x="52" y="227" font-size="11" fill="#0f766e" font-weight="700">never leaves the tab</text>
  <rect x="38" y="250" width="304" height="62" rx="8" fill="#ffffff" stroke="#d5d0c2"/>
  <text x="52" y="270" font-weight="700" fill="#101114">The twin's hook picks a route</text>
  <text x="52" y="286" font-size="11" fill="#34363c">twin: answered in the tab, from sg-vfs</text>
  <text x="52" y="301" font-size="11" fill="#34363c">live: on to AWS · replay: from a recording</text>
  <rect x="38" y="324" width="304" height="58" rx="8" fill="#f2f0e9" stroke="#d5d0c2"/>
  <text x="52" y="344" font-weight="700" fill="#101114">Every request recorded</text>
  <text x="52" y="360" font-size="11" fill="#34363c">service, operation, route, status, time;</text>
  <text x="52" y="374" font-size="11" fill="#34363c">writes refused in live mode unless allowed</text>

  <!-- the relay -->
  <rect x="420" y="250" width="200" height="98" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/>
  <text x="434" y="272" font-size="11" fill="#b45309" letter-spacing="1.5" font-weight="700">YOUR MACHINE</text>
  <text x="434" y="292" font-weight="700" fill="#101114">Twin__Relay.py</text>
  <text x="434" y="308" font-size="11" fill="#34363c">127.0.0.1:4567 · one file</text>
  <text x="434" y="323" font-size="11" fill="#34363c">no credentials · AWS hosts only</text>
  <text x="434" y="338" font-size="11" fill="#34363c">adds the CORS headers S3 omits</text>

  <!-- AWS -->
  <rect x="680" y="20" width="240" height="380" rx="14" fill="#ffffff" stroke="#d5d0c2"/>
  <text x="698" y="46" font-size="11" fill="#5c5f66" letter-spacing="2" font-weight="700">YOUR AWS ACCOUNT</text>
  <rect x="698" y="70" width="204" height="70" rx="8" fill="rgba(15,118,110,.06)" stroke="#0f766e"/>
  <text x="712" y="92" font-weight="700" fill="#101114">STS GetCallerIdentity</text>
  <text x="712" y="108" font-size="11" fill="#34363c">answers any origin</text>
  <text x="712" y="126" font-size="11" fill="#0f766e" font-weight="700">✓ a real session, checked</text>
  <rect x="698" y="160" width="204" height="70" rx="8" fill="#ffffff" stroke="#d5d0c2"/>
  <text x="712" y="182" font-weight="700" fill="#101114">S3, a bucket with CORS</text>
  <text x="712" y="198" font-size="11" fill="#34363c">answers this site, that bucket</text>
  <text x="712" y="216" font-size="11" fill="#34363c">no relay needed</text>
  <rect x="698" y="250" width="204" height="98" rx="8" fill="#ffffff" stroke="#d5d0c2"/>
  <text x="712" y="272" font-weight="700" fill="#101114">S3 ListBuckets, and</text>
  <text x="712" y="288" font-weight="700" fill="#101114">buckets without CORS</text>
  <text x="712" y="306" font-size="11" fill="#34363c">never answer a browser:</text>
  <text x="712" y="321" font-size="11" fill="#34363c">reached through the relay,</text>
  <text x="712" y="336" font-size="11" fill="#34363c">same signature, checked by AWS</text>

  <!-- arrows -->
  <path d="M342 205 C 520 205, 560 105, 696 105" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#mg)"/>
  <text x="470" y="130" font-size="11" fill="#0f766e" font-weight="700">direct, from the browser</text>
  <path d="M342 225 C 520 225, 560 195, 696 195" fill="none" stroke="#5c5f66" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#m)"/>
  <text x="470" y="200" font-size="11" fill="#5c5f66">direct, with the bucket's rule</text>
  <path d="M342 290 L 418 295" fill="none" stroke="#b45309" stroke-width="1.8" marker-end="url(#mw)"/>
  <path d="M620 299 L 696 299" fill="none" stroke="#b45309" stroke-width="1.8" marker-end="url(#mw)"/>
  <text x="430" y="370" font-size="11" fill="#b45309">the signed request, unchanged</text>

  <!-- the claim -->
  <rect x="20" y="420" width="900" height="62" rx="12" fill="#0d1117"/>
  <text x="40" y="447" font-size="14" font-weight="700" fill="#ffffff">No server of ours in the path.</text>
  <text x="270" y="447" font-size="13" fill="#c9d1d9">The tab signs, the browser or your own machine sends, AWS checks the signature.</text>
  <text x="40" y="469" font-size="12" fill="#8b949e">The same Python, the same OSBot-AWS calls and the same tests run in CI against the twin; in the tab they reach the real account.</text>
</svg>
