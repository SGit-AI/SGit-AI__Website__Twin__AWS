<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13">
  <title>One Python twin, two places: CI and the browser, the same code and the same tests</title>
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5c5f66"/></marker>
    <marker id="mw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
  </defs>
  <rect width="940" height="470" fill="#faf9f5"/>

  <!-- two columns -->
  <rect x="20" y="20" width="420" height="300" rx="14" fill="#ffffff" stroke="#d5d0c2"/>
  <text x="38" y="46" font-size="11" fill="#5c5f66" letter-spacing="2" font-weight="700">CI · CPYTHON · PYTEST</text>
  <rect x="500" y="20" width="420" height="300" rx="14" fill="#ffffff" stroke="#d5d0c2"/>
  <text x="518" y="46" font-size="11" fill="#5c5f66" letter-spacing="2" font-weight="700">THE BROWSER · PYODIDE 0.28.3</text>

  <!-- callers -->
  <g>
    <rect x="38" y="60" width="384" height="44" rx="8" fill="rgba(29,78,216,.06)" stroke="#1d4ed8"/>
    <text x="54" y="80" font-weight="700" fill="#101114">tests/*.py · OSBot-AWS S3() · boto3</text>
    <text x="54" y="96" font-size="11" fill="#34363c">18 passed, 1 live test opt-in</text>
    <rect x="518" y="60" width="384" height="44" rx="8" fill="rgba(29,78,216,.06)" stroke="#1d4ed8"/>
    <text x="534" y="80" font-weight="700" fill="#101114">the same tests · the S3 browser · OSBot-AWS S3()</text>
    <text x="534" y="96" font-size="11" fill="#34363c">16 passed, 3 skipped (no sockets, no disk, live opt-in)</text>
  </g>
  <line x1="230" y1="104" x2="230" y2="126" stroke="#5c5f66" stroke-width="1.5" marker-end="url(#m)"/>
  <line x1="710" y1="104" x2="710" y2="126" stroke="#5c5f66" stroke-width="1.5" marker-end="url(#m)"/>

  <!-- botocore -->
  <rect x="38" y="128" width="384" height="34" rx="8" fill="#f2f0e9" stroke="#8a8d94"/>
  <text x="54" y="150" fill="#101114">botocore signs the request: SigV4, real AWS URLs</text>
  <rect x="518" y="128" width="384" height="34" rx="8" fill="#f2f0e9" stroke="#8a8d94"/>
  <text x="534" y="150" fill="#101114">botocore signs the request: SigV4, real AWS URLs</text>
  <line x1="230" y1="162" x2="230" y2="184" stroke="#5c5f66" stroke-width="1.5" marker-end="url(#m)"/>
  <line x1="710" y1="162" x2="710" y2="184" stroke="#5c5f66" stroke-width="1.5" marker-end="url(#m)"/>

  <!-- the twin, spanning both -->
  <rect x="38" y="186" width="864" height="70" rx="12" fill="rgba(15,118,110,.08)" stroke="#0f766e" stroke-width="2"/>
  <text x="470" y="210" text-anchor="middle" font-weight="700" fill="#101114">aws_twin: one Python package, standard library only, 35.4 KB as the browser bundle</text>
  <text x="470" y="230" text-anchor="middle" font-size="12" fill="#34363c">the botocore hook · S3 REST-XML (21 operations and nine bucket configurations) · STS GetCallerIdentity · 501 for the rest, by name</text>
  <text x="470" y="247" text-anchor="middle" font-size="12" fill="#34363c">routes per service: twin · live · replay · every request recorded</text>

  <line x1="230" y1="256" x2="230" y2="278" stroke="#5c5f66" stroke-width="1.5" marker-end="url(#m)"/>
  <line x1="710" y1="256" x2="710" y2="278" stroke="#5c5f66" stroke-width="1.5" marker-end="url(#m)"/>
  <rect x="38" y="280" width="384" height="30" rx="8" fill="#ffffff" stroke="#0f766e"/>
  <text x="54" y="300" fill="#101114">VFS: memory, or disk for <tspan font-family="ui-monospace, Menlo, monospace" font-size="12">python -m aws_twin</tspan></text>
  <rect x="518" y="280" width="384" height="30" rx="8" fill="#ffffff" stroke="#0f766e"/>
  <text x="534" y="300" fill="#101114">VFS: memory with a journal, written to sg-vfs IndexedDB</text>

  <!-- live -->
  <rect x="20" y="344" width="900" height="110" rx="14" fill="rgba(180,83,9,.05)" stroke="#b45309" stroke-dasharray="6 4"/>
  <text x="38" y="368" font-size="11" fill="#b45309" letter-spacing="2" font-weight="700">THE LIVE ROUTE · MEASURED WITH INVENTED KEYS</text>
  <text x="38" y="392" fill="#101114">CPython: botocore's own send. Browser: urllib3's browser fetch, because botocore's sockets do not exist there.</text>
  <text x="38" y="414" fill="#101114">Both reached sts.eu-west-2.amazonaws.com and came back 403 InvalidClientTokenId: the request left, signed, and was read.</text>
  <text x="38" y="436" fill="#34363c" font-size="12">The SSO portal refuses browsers (Origin not allowed); Cognito, STS web identity and Roles Anywhere allow them.</text>
  <line x1="470" y1="310" x2="470" y2="342" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#mw)"/>
</svg>
